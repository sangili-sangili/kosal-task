version: '3.8'

services:
  # MySQL 8.0 Relational Database
  mysql:
    image: mysql:8.0
    container_name: enterprise_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: enterprise_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - enterprise_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 7.0 In-Memory Cache & BullMQ Queue Store
  redis:
    image: redis:7.0-alpine
    container_name: enterprise_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - enterprise_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Enterprise Node.js / Express API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: enterprise_db
      DB_USER: root
      DB_PASSWORD: root_password
      DB_DIALECT: mysql
      USE_SQLITE_FALLBACK: "false"
      JWT_ACCESS_SECRET: enterprise_jwt_access_secret_production_key_32bytes_minimum!
      JWT_REFRESH_SECRET: enterprise_jwt_refresh_secret_production_key_32bytes_minimum!
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION_DAYS: 7
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enterprise_network

  # Enterprise React + Vite + Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - enterprise_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  enterprise_network:
    driver: bridge
